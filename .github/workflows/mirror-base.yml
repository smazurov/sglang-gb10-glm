name: mirror-base
# One-time base mirror; re-run whenever profile.yaml's base pin changes.
#
# Pull the pinned arm64 base from Docker Hub and mirror it byte-identically
# into GHCR. Rationale: Docker Hub pulls from hosted runners are the slow,
# high-variance leg (observed 1.7-70 MB/s for the same blobs within an hour);
# GHCR -> runner is same-cloud and fast. Once the base lives in GHCR, the
# image build pulls from GHCR and the image push can cross-repo-mount the
# shared base blobs (buildkit's mount path) instead of re-uploading 14 GiB.
#
# Byte identity is enforced twice: skopeo copy --preserve-digests fails
# closed if it cannot preserve the manifest digest, and the assert fetches
# the raw manifest and requires sha256(bytes) == the pinned digest. (Plain
# `docker push` re-serializes OCI manifests into Docker v2 and changes the
# digest — that is exactly what this workflow exists to avoid.)
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: docker.io/lmsysorg/sglang@sha256:df8461b8099014daccc1dd548517578f110e601f6e893c55c23a83c2521bed53
  MIRROR: ghcr.io/smazurov/sglang-base

jobs:
  mirror:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-runner
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Copy base into GHCR (digest-preserving)
        id: push
        run: |
          set -eu -o pipefail
          short=$(echo "$UPSTREAM" | sed 's/.*sha256://; s/^\(........\).*/\1/')
          # streams blob-by-blob; --preserve-digests fails closed unless the
          # manifest bytes survive the round trip
          skopeo copy --preserve-digests \
            "docker://lmsysorg/sglang@sha256:df8461b8099014daccc1dd548517578f110e601f6e893c55c23a83c2521bed53" \
            "docker://$MIRROR:$short"
          echo "short=$short" >> "$GITHUB_OUTPUT"
      - name: Assert byte-identical mirror (raw manifest sha256 == pinned digest)
        run: |
          set -eu -o pipefail
          short=${{ steps.push.outputs.short }}
          pinned="sha256:df8461b8099014daccc1dd548517578f110e601f6e893c55c23a83c2521bed53"
          skopeo inspect --raw "docker://lmsysorg/sglang@$pinned" > /tmp/upstream.json
          skopeo inspect --raw "docker://$MIRROR:$short" > /tmp/mirror.json
          up=$(sha256sum /tmp/upstream.json | cut -d' ' -f1)
          mi=$(sha256sum /tmp/mirror.json | cut -d' ' -f1)
          test "$up" = "$pinned" || { echo "::error::upstream manifest hash $up != pinned $pinned"; exit 1; }
          test "$mi" = "$up" || { echo "::error::mirror drift: $mi != $up"; exit 1; }
          {
            echo "## base mirror receipt"
            echo ""
            echo "mirror ref for the build pin: \`$MIRROR@$pinned\`"
            echo "raw manifest sha256: \`$mi\` (byte-identical to upstream)"
          } >> "$GITHUB_STEP_SUMMARY"
