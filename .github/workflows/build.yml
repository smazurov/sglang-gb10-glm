name: build
# Build, validate, and publish the candidate image on public hosted infra
# (no GPUs, no cluster). Job graph:
#
#   tag ──> wheels ──> build(+CPU pre-test) ──> tags ──> receipts
#     └── pre-test (dispatch-only: revalidate an already-published stable tag)
#
# - tag:      content-addressed tag; skip decision when already published
# - wheels:   cache-or-fetch the pinned wheels (artifact, ~30 MB)
# - build:    build LOCALLY (unpushed), run the CPU processor gate against the
#             vendored MIT-licensed checkpoint interface files (checkpoint/),
#             and push by digest ONLY if the gate passes — GHCR does not
#             garbage-collect untagged manifests, so nothing unvalidated lands
# - tags:     assemble the dated + stable tags; an unnamed digest stays
#             garbage-collectable
# - receipts: run summary (tag, digest, per-job outcomes)
#
# publish ≠ accepted: cluster-side T2 (GPU) and T3 (serving) remain ad hoc —
# see validation/commands.md. A gate failure leaves the workflow red and the
# registry untouched.
#
# force_t1 (workflow_dispatch): re-run the CPU gate against the ALREADY
# PUBLISHED stable tag (e.g. after a checkpoint-interface bump with an
# unchanged recipe). Never rebuilds: a same-tag rebuild would move the stable
# tag to a new digest, breaking content addressing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_t1:
        description: 'Re-run the T1 CPU gate against the published stable tag'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/smazurov/sglang-gb10-glm
  SNAPSHOT: /cache/huggingface/hub/models--local-inference-lab--GLM-5.3-Flash-NVFP4-Spark/snapshots/53e77dbb04fa9dd68725daa899ec92eabf8a872c

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      stable: ${{ steps.tag.outputs.stable }}
      exists: ${{ steps.present.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: python3 -m pip install --user pyyaml packaging
      - name: Content-addressed tag
        id: tag
        run: |
          set -eu
          sha8=$(python3 scripts/tag.py --sha8)
          date=$(date +%Y%m%d)
          echo "tag=glm-flash-v2-${date}-${sha8}" | tee -a "$GITHUB_OUTPUT"
          echo "stable=glm-flash-v2-${sha8}" | tee -a "$GITHUB_OUTPUT"
      - name: Skip only if tag is published AND fully resolvable
        id: present
        run: |
          set -eu -o pipefail
          # docker manifest inspect alone cannot detect an index whose child
          # manifests were removed (GHCR versions API lists them as "versions");
          # a shallow hit there would skip a build and leave a pull-broken tag.
          if docker manifest inspect "$IMAGE:${{ steps.tag.outputs.stable }}" > /dev/null 2>&1 \
            && python3 scripts/check-tag-resolvable.py "$IMAGE:${{ steps.tag.outputs.stable }}"; then
            echo "Tag already published and resolvable; build and wheels jobs will be skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag missing or not fully resolvable; building." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  wheels:
    if: needs.tag.outputs.exists != 'true'
    needs: tag
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Wheel cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: wheels-${{ hashFiles('contracts/requirements.lock') }}
      - name: Fetch wheels (sha256 contract verified)
        run: python3 scripts/fetch-wheels.py
      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheels/
          retention-days: 1

  build:
    if: needs.tag.outputs.exists != 'true'
    needs: [tag, wheels]
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-runner
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Upstream sglang's push-by-digest pattern, gated: build locally and
      # push by digest only after the CPU pre-test passes. The second buildx
      # invocation is a no-op build — same builder, context, and args, so
      # every layer cache-hits and only the export differs (load → push).
      - name: Build locally (unpushed)
        run: |
          set -eu
          docker buildx build \
            --platform linux/arm64 \
            --load -t "$IMAGE:candidate" \
            -f docker/Dockerfile \
            --build-arg IMAGE_SOURCE="${{ github.server_url }}/${{ github.repository }}" \
            --build-arg IMAGE_REVISION="${{ github.sha }}" \
            --build-arg IMAGE_VERSION="${{ needs.tag.outputs.tag }}" \
            .
      - name: Normalize checkpoint metadata (pinned hash)
        run: |
          set -eu
          python3 gates/normalize_modelopt.py < checkpoint/config.json > modelopt-flat-config.json
          got=$(sha256sum modelopt-flat-config.json | cut -d' ' -f1)
          want=$(python3 -c "import yaml; print(yaml.safe_load(open('profile.yaml'))['checkpoint']['metadata']['normalized_sha256'])")
          test "$got" = "$want" || { echo "::error::normalized metadata hash drift: $got != $want"; exit 1; }
      - name: CPU pre-test gate (offline, runc, 4 GiB) — blocks the push
        run: |
          set -eu
          docker run --rm --runtime=runc --network=none \
            --memory=4g --cpus=4 \
            --entrypoint /opt/sglang/bin/python3 \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 \
            -v "$PWD/checkpoint:$SNAPSHOT:ro" \
            -v "$PWD/modelopt-flat-config.json:$SNAPSHOT/config.json:ro" \
            "$IMAGE:candidate" \
            /opt/glm-gates/gate-processor.py "$SNAPSHOT" \
            | tee /tmp/pre-test-gate.log
          grep -q GLM_PROCESSOR_PASS /tmp/pre-test-gate.log
      - name: Push by digest (gate passed)
        id: build
        run: |
          set -eu
          docker buildx build \
            --platform linux/arm64 \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            -f docker/Dockerfile \
            --build-arg IMAGE_SOURCE="${{ github.server_url }}/${{ github.repository }}" \
            --build-arg IMAGE_REVISION="${{ github.sha }}" \
            --build-arg IMAGE_VERSION="${{ needs.tag.outputs.tag }}" \
            --metadata-file /tmp/metadata.json \
            .
          digest=$(python3 -c "import json; print(json.load(open('/tmp/metadata.json'))['containerimage.digest'])")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Release build cache
        run: |
          docker rmi "$IMAGE:candidate" || true
          docker buildx prune -f

  pre-test:
    # Dispatch-only revalidation: run the CPU gate against an ALREADY
    # PUBLISHED stable tag (e.g. after a checkpoint-interface bump with an
    # unchanged recipe). Pulls by digest, so it validates exactly what a
    # consumer would get. On regular pushes the gate already ran in-build
    # before the push, so this job is skipped.
    needs: [tag, build]
    if: always() && inputs.force_t1 == true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-runner
      - name: Install deps
        run: python3 -m pip install --user pyyaml packaging
      - name: Resolve the published digest
        id: digest
        run: |
          set -eu -o pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:${{ needs.tag.outputs.stable }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$digest" || { echo "::error::could not resolve the published digest"; exit 1; }
          echo "digest=$digest" | tee -a "$GITHUB_OUTPUT"
      - name: Normalize checkpoint metadata (pinned hash)
        run: |
          set -eu
          python3 gates/normalize_modelopt.py < checkpoint/config.json > modelopt-flat-config.json
          got=$(sha256sum modelopt-flat-config.json | cut -d' ' -f1)
          want=$(python3 -c "import yaml; print(yaml.safe_load(open('profile.yaml'))['checkpoint']['metadata']['normalized_sha256'])")
          test "$got" = "$want" || { echo "::error::normalized metadata hash drift: $got != $want"; exit 1; }
      - name: Run the pre-test CPU processor gate (offline, runc, 4 GiB)
        run: |
          set -eu
          docker pull --quiet "$IMAGE@${{ steps.digest.outputs.digest }}"
          docker run --rm --pull=never --runtime=runc --network=none \
            --memory=4g --cpus=4 \
            --entrypoint /opt/sglang/bin/python3 \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 \
            -v "$PWD/checkpoint:$SNAPSHOT:ro" \
            -v "$PWD/modelopt-flat-config.json:$SNAPSHOT/config.json:ro" \
            "$IMAGE@${{ steps.digest.outputs.digest }}" \
            /opt/glm-gates/gate-processor.py "$SNAPSHOT" \
            | tee /tmp/pre-test-gate.log
          grep -q GLM_PROCESSOR_PASS /tmp/pre-test-gate.log

  tags:
    # Named tags land on the gate-passed digest; nothing earlier is named.
    if: needs.tag.outputs.exists != 'true'
    needs: [tag, build]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble tags on the pushed digest
        run: |
          # dated tag (deploy reference) + dateless stable tag (the serving
          # repo pins this one); same digest, no rebuild
          docker buildx imagetools create \
            -t "$IMAGE:${{ needs.tag.outputs.tag }}" \
            -t "$IMAGE:${{ needs.tag.outputs.stable }}" \
            "$IMAGE@${{ needs.build.outputs.digest }}"

  receipts:
    needs: [tag, build, tags]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Publish receipts
        run: |
          build_out="${{ needs.build.result }}"
          {
            echo "## build receipt"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| stable tag | \`${{ needs.tag.outputs.stable }}\` |"
            echo "| dated tag | \`${{ needs.tag.outputs.tag }}\` |"
            echo "| build | $build_out |"
            echo "| digest | \`${{ needs.build.outputs.digest }}\` |"
            echo "| CPU pre-test | in-build gate (blocked the push) |"
            echo "| tags | ${{ needs.tags.result }} |"
            echo ""
            echo "T2 (GPU) and T3 (serving) are cluster-side: validation/commands.md."
          } >> "$GITHUB_STEP_SUMMARY"
