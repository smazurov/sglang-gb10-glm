name: build
# Build + publish the candidate image on public hosted infra (no GPUs, no
# cluster). Publishes after the in-build gates pass; checkpoint-coupled
# validation (T1/T2/T3) is ad hoc on the cluster — see validation/commands.md.
#
# Disk budget on standard runners: single ~72G root (docs say 14 GB usable —
# that is a service level, not the device). After jlumbroso cleanup the arm64
# image has ~55G free; the pinned base is 14.2 GiB compressed (~30-35 unpacked).
# The df assert below fails loudly if the runner layout changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/smazurov/sglang-gb10-glm

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Assert runner disk layout (receipt + fail-closed)
        run: |
          df -hT | tee "$GITHUB_STEP_SUMMARY"
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "free: ${free_gb}G" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$free_gb" -lt 50 ]; then
            echo "::error::runner disk layout changed (${free_gb}G free < 50G); re-evaluate build topology"
            exit 1
          fi

      - name: Install build deps
        run: python3 -m pip install --user pyyaml packaging

      - name: Content-addressed tag
        id: tag
        run: |
          set -eu
          sha8=$(python3 scripts/tag.py --sha8)
          date=$(date +%Y%m%d)
          echo "tag=glm-flash-v2-${date}-${sha8}" | tee -a "$GITHUB_OUTPUT"
          echo "stable=glm-flash-v2-${sha8}" | tee -a "$GITHUB_OUTPUT"

      - name: Skip if tag already published
        id: present
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.tag.outputs.tag }}" > /dev/null 2>&1; then
            echo "Tag already published; skipping build." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wheel cache
        if: steps.present.outputs.exists != 'true'
        uses: actions/cache@v4
        with:
          path: wheels
          key: wheels-${{ hashFiles('contracts/requirements.lock') }}

      - name: Fetch wheels (sha256 contract verified)
        if: steps.present.outputs.exists != 'true'
        run: python3 scripts/fetch-wheels.py

      - name: Set up Buildx
        if: steps.present.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.present.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Upstream sglang's push-by-digest pattern: build once, push the digest,
      # then assemble named tags on it (no rebuild per tag).
      - name: Build and push by digest
        id: build
        if: steps.present.outputs.exists != 'true'
        run: |
          set -eu
          docker buildx build \
            --platform linux/arm64 \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            -f docker/Dockerfile \
            --build-arg IMAGE_SOURCE="${{ github.server_url }}/${{ github.repository }}" \
            --build-arg IMAGE_REVISION="${{ github.sha }}" \
            --build-arg IMAGE_VERSION="${{ steps.tag.outputs.tag }}" \
            --metadata-file /tmp/metadata.json \
            .
          digest=$(python3 -c "import json; print(json.load(open('/tmp/metadata.json'))['containerimage.digest'])")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Assemble tags on the pushed digest
        if: steps.present.outputs.exists != 'true'
        run: |
          # dated tag (the deploy reference) + dateless stable tag (the serving repo pins
          # this one; same digest, no rebuild)
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.tag.outputs.tag }}" \
            -t "$IMAGE:${{ steps.tag.outputs.stable }}" \
            "$IMAGE@${{ steps.build.outputs.digest }}"

      - name: Release build cache before reporting
        if: steps.present.outputs.exists != 'true'
        run: docker buildx prune -f

      - name: Publish receipts
        if: always()
        run: |
          {
            echo "## build receipt"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| tag | \`${{ steps.tag.outputs.tag }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| image | \`$IMAGE:${{ steps.tag.outputs.tag }}\` |"
            echo ""
            echo "Candidate only: T0 (in-build gates) passed. T1/T2/T3 are"
            echo "cluster-side; run validation/commands.md before adoption."
          } >> "$GITHUB_STEP_SUMMARY"
